@if (screenshots.length) {
  <section class="gallery" aria-labelledby="screenshots-title">
    <h2 id="screenshots-title">{{ 'project_detail.screenshots_title' | translate }}</h2>
    <div class="gallery__track">
      @for (screenshot of screenshots; track screenshot.src) {
        <figure><button type="button" (click)="selected = screenshot" [attr.aria-label]="('project_detail.enlarge' | translate) + ': ' + screenshot.alt"><img [src]="screenshot.src" [alt]="screenshot.alt" loading="lazy" decoding="async" /></button>@if (screenshot.caption) { <figcaption>{{ screenshot.caption }}</figcaption> }</figure>
      }
    </div>
  </section>
}
@if (selected) {
  <div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="selected.alt"><button type="button" class="lightbox__close" (click)="selected = null" [attr.aria-label]="'project_detail.close' | translate">×</button><img [src]="selected.src" [alt]="selected.alt" /></div>
}
