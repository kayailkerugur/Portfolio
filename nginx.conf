server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Statik dosyalar için agresif cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # i18n JSON dosyaları cache'lenmesin (dil dosyaları güncellenebilir)
    location /i18n/ {
        expires off;
        add_header Cache-Control "no-cache" always;
    }

    # Angular SPA — tüm rotaları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
